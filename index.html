        html += `
          <button onclick="filterCategory('${cat.id}')" class="cat-btn bg-slate-900 border border-slate-800 text-slate-300 hover:text-white px-4 py-2 rounded-xl whitespace-nowrap transition font-bold flex items-center gap-1.5 hover:border-diner-cyan">
            <i class="fa-solid ${cat.icon} text-diner-cyan"></i> ${cat.title.split('(')[0]}
          </button>
        `;
      });

      navContainer.innerHTML = html;
    }

    // RENDERIZAR MENÚ COMPLETO
    function renderMenu(data) {
      const menuContainer = document.getElementById('menu-container');
      
      if (data.length === 0) {
        menuContainer.innerHTML = `
          <div class="text-center py-16 bg-slate-900/50 rounded-3xl border border-slate-800">
            <i class="fa-solid fa-magnifying-glass text-4xl text-slate-600 mb-3"></i>
            <h3 class="text-lg font-bold text-white">No se encontraron productos</h3>
            <p class="text-xs text-slate-400 mt-1">Intenta buscando con otra palabra o ingrediente.</p>
          </div>
        `;
        return;
      }

      let html = '';

      data.forEach(sec => {
        html += `
          <section id="sec-${sec.id}" class="space-y-4">
            <div class="border-b border-slate-800 pb-3 flex flex-wrap justify-between items-end gap-2">
              <div>
                <span class="text-diner-pink font-bold text-xs tracking-widest uppercase block">${sec.badge}</span>
                <h2 class="text-2xl font-black uppercase tracking-wider text-white flex items-center gap-2">
                  <i class="fa-solid ${sec.icon} text-diner-cyan"></i> ${sec.title}
                </h2>
              </div>
            </div>

            <div class="grid md:grid-cols-2 gap-4">
        `;

        sec.items.forEach(item => {
          const isTop = item.badge;
          const cartItem = cart.find(ci => ci.name === item.name);
          const qty = cartItem ? cartItem.quantity : 0;

          html += `
            <div class="bg-diner-card border ${isTop ? 'border-diner-pink/60 neon-border-pink' : 'border-slate-800'} rounded-2xl p-4 flex flex-col justify-between hover:border-slate-700 transition relative">
              ${isTop ? `<span class="absolute top-3 right-3 bg-diner-pink text-slate-950 font-black text-[10px] tracking-widest px-2.5 py-0.5 rounded uppercase">${item.badge}</span>` : ''}
              <div>
                <div class="mb-1 pr-16">
                  <h3 class="font-bold text-white text-base">${item.name}</h3>
                  ${item.tag ? `<span class="inline-block bg-diner-yellow/20 text-diner-yellow text-[10px] font-bold px-2 py-0.5 rounded border border-diner-yellow/30 mt-1">${item.tag}</span>` : ''}
                </div>
                <p class="text-slate-400 text-xs leading-relaxed my-3">${item.desc}</p>
              </div>

              <div class="flex justify-between items-center pt-3 border-t border-slate-800/80 mt-2">
                <span class="text-lg font-black text-diner-cyan">$${item.price.toLocaleString('es-CO')}</span>
                
                <div id="btn-container-${sanitizeId(item.name)}">
                  ${qty > 0 ? `
                    <div class="flex items-center gap-2 bg-slate-900 border border-slate-700 rounded-xl p-1">
                      <button onclick="updateQty('${escapeString(item.name)}', -1)" class="w-7 h-7 bg-slate-800 text-white rounded-lg font-bold hover:bg-diner-pink hover:text-slate-950 transition">-</button>
                      <span class="font-bold text-xs text-white px-1">${qty}</span>
                      <button onclick="updateQty('${escapeString(item.name)}', 1)" class="w-7 h-7 bg-slate-800 text-white rounded-lg font-bold hover:bg-diner-cyan hover:text-slate-950 transition">+</button>
                    </div>
                  ` : `
                    <button onclick="addToCart('${escapeString(item.name)}', ${item.price})" class="bg-slate-800 hover:bg-diner-pink hover:text-slate-950 text-slate-200 font-bold px-3.5 py-2 rounded-xl text-xs transition flex items-center gap-1.5 border border-slate-700">
                      <i class="fa-solid fa-plus text-diner-cyan"></i> Agregar
                    </button>
                  `}
                </div>
              </div>
            </div>
          `;
        });

        html += `
            </div>
          </section>
        `;
      });

      menuContainer.innerHTML = html;
    }

    // AÑADIR O ACTUALIZAR PRODUCTOS
    function addToCart(name, price) {
      const existing = cart.find(item => item.name === name);
      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({ name, price, quantity: 1 });
      }
      
      showToast(`¡${name} agregado al pedido!`);
      updateUI();
    }

    function updateQty(name, delta) {
      const item = cart.find(i => i.name === name);
      if (item) {
        item.quantity += delta;
        if (item.quantity <= 0) {
          cart = cart.filter(i => i.name !== name);
        }
      }
      updateUI();
    }

    function updateUI() {
      // Actualizar resumen del footer
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

      document.getElementById('cart-count').innerText = `${totalItems} ítems`;
      document.getElementById('cart-total').innerText = `$${totalPrice.toLocaleString('es-CO')}`;
      document.getElementById('modal-total-price').innerText = `$${totalPrice.toLocaleString('es-CO')}`;

      // Renderizar modal
      const modalList = document.getElementById('modal-item-list');
      if (cart.length === 0) {
        modalList.innerHTML = '<p class="text-slate-500 text-center py-6">Tu carrito está vacío. Agrega tus platos o bebidas favoritas.</p>';
      } else {
        modalList.innerHTML = cart.map(item => `
          <div class="flex justify-between items-center py-2.5">
            <div>
              <p class="font-bold text-white text-xs">${item.name}</p>
              <p class="text-[10px] text-slate-400">$${item.price.toLocaleString('es-CO')} c/u</p>
            </div>
            <div class="flex items-center gap-2">
              <span class="font-bold text-diner-cyan text-xs pr-2">$${(item.price * item.quantity).toLocaleString('es-CO')}</span>
              <div class="flex items-center gap-1.5 bg-slate-900 border border-slate-700 rounded-lg p-0.5">
                <button onclick="updateQty('${escapeString(item.name)}', -1)" class="w-5 h-5 bg-slate-800 text-white rounded font-bold hover:bg-diner-pink transition">-</button>
                <span class="font-mono text-white text-xs px-1">${item.quantity}</span>
                <button onclick="updateQty('${escapeString(item.name)}', 1)" class="w-5 h-5 bg-slate-800 text-white rounded font-bold hover:bg-diner-cyan transition">+</button>
              </div>
            </div>
          </div>
        `).join('');
      }

      // Volver a renderizar los botones en las tarjetas
      renderMenu(currentFilteredData || menuData);
    }

    // FILTRO DE BÚSQUEDA EN TIEMPO REAL
    let currentFilteredData = null;

    function filterMenu() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const clearBtn = document.getElementById('clear-search');

      if (query.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
        currentFilteredData = null;
        renderMenu(menuData);
        return;
      }

      const filtered = menuData.map(sec => {
        const matchingItems = sec.items.filter(item => 
          item.name.toLowerCase().includes(query) || 
          item.desc.toLowerCase().includes(query)
        );
        return { ...sec, items: matchingItems };
      }).filter(sec => sec.items.length > 0);

      currentFilteredData = filtered;
      renderMenu(filtered);
    }

    function clearSearch() {
      document.getElementById('search-input').value = '';
      document.getElementById('clear-search').classList.add('hidden');
      currentFilteredData = null;
      renderMenu(menuData);
    }

    // FILTRO POR CATEGORÍA
    function filterCategory(catId) {
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('bg-diner-pink', 'text-slate-950', 'font-extrabold');
        btn.classList.add('bg-slate-900', 'text-slate-300');
      });
      event.currentTarget.classList.remove('bg-slate-900', 'text-slate-300');
      event.currentTarget.classList.add('bg-diner-pink', 'text-slate-950', 'font-extrabold');

      if (catId === 'todos') {
        currentFilteredData = null;
        renderMenu(menuData);
      } else {
        const selected = menuData.filter(sec => sec.id === catId);
        currentFilteredData = selected;
        renderMenu(selected);
      }
    }

    // ENVIAR PEDIDO POR WHATSAPP
    function sendOrderWhatsApp() {
      if (cart.length === 0) {
        alert('Por favor añade al menos un producto al pedido.');
        return;
      }

      const phoneNumber = '573215484976';
      const name = document.getElementById('order-name').value.trim();
      const table = document.getElementById('order-table').value.trim();
      const notes = document.getElementById('order-notes').value.trim();
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

      let text = `*¡Hola Roger's Diner! Quiero realizar el siguiente pedido:* 🍔🍹\n\n`;
      if (name) text += `👤 *Cliente:* ${name}\n`;
      if (table) text += `📍 *Mesa / Dirección:* ${table}\n`;
      text += `-----------------------------------\n`;

      cart.forEach(item => {
        text += `• ${item.quantity}x ${item.name} - *$${(item.price * item.quantity).toLocaleString('es-CO')}*\n`;
      });

      text += `-----------------------------------\n`;
      text += `💰 *TOTAL DE COMPRA:* *$${totalPrice.toLocaleString('es-CO')}*\n`;
      if (notes) text += `📝 *Observaciones / Sabores:* ${notes}\n`;
      text += `\n*Dirección del Local:* Cl. 51 Sur #87-18, Bogotá`;

      const encodedText = encodeURIComponent(text);
      window.open(`https://wa.me/${phoneNumber}?text=${encodedText}`, '_blank');
    }

    // NOTIFICACIÓN TOAST
    function showToast(message) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = message;
      toast.classList.remove('translate-x-72', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-x-72', 'opacity-0');
      }, 2500);
    }

    // MODAL
    function openCartModal() {
      document.getElementById('cart-modal').classList.remove('hidden');
    }
    function closeCartModal() {
      document.getElementById('cart-modal').classList.add('hidden');
    }
    function clearCart() {
      cart = [];
      updateUI();
      closeCartModal();
    }

    // AUXILIARES
    function sanitizeId(str) {
      return str.replace(/[^a-zA-Z0-9]/g, '_');
    }
    function escapeString(str) {
      return str.replace(/'/g, "\\'");
    }
  </script>
</body>
</html>
